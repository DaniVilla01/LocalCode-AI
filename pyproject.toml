[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code-agent"
version = "0.1.0"
description = "Asistente local de código para terminal, tipo Claude Code, con herramientas seguras."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Local Code Agent contributors" }
]
keywords = ["llm", "local", "ollama", "coding-agent", "terminal", "assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.0"]

[project.scripts]
local-code-agent = "local_code_agent:main"

[project.urls]
Homepage = "https://github.com/TU_USUARIO/local-code-agent"
Repository = "https://github.com/TU_USUARIO/local-code-agent"
Issues = "https://github.com/TU_USUARIO/local-code-agent/issues"

[tool.setuptools]
py-modules = ["local_code_agent"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
